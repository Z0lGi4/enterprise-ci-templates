name: 'Python Install'
description: 'Install a Python project regardless of how it declares itself'
inputs:
  working-directory:
    description: 'Directory holding the project'
    required: false
    default: '.'
  test-deps:
    description: 'Also install pytest + pytest-cov (the coverage gate needs them)'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    # Three real repo shapes, not one:
    #   1. packaged      — pyproject.toml with [project]/[build-system], or setup.py
    #   2. config-only   — pyproject.toml carrying ONLY [tool.*], deps in requirements.txt
    #   3. requirements  — requirements.txt, no pyproject at all
    #
    # `pip install -e .` fails outright on 2 and 3 when the source sits in
    # several top-level directories: setuptools' flat-layout auto-discovery
    # refuses to build ("Multiple top-level packages discovered in a
    # flat-layout"). seoforge-ai has 17 of them. Four repos in this fleet have
    # that shape, so guessing wrong blocks half the rollout.
    #
    # Lives in a composite action because `test` and `dependency-audit` both
    # need it and they HAVE already drifted: the first fix landed in `test`
    # only, and dependency-audit kept failing until the requirements-shape
    # fixture caught it.
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -f pyproject.toml ] && grep -Eq '^\[(project|build-system)\]' pyproject.toml; then
          pip install -e ".[dev]" || pip install -e .
        elif [ -f setup.py ]; then
          pip install -e .
        fi
        # No `|| true` here on purpose — same defect class as the
        # `pip-audit --local || true` fixed earlier. A dependency install that
        # fails must not report success and leave the tests to fail confusingly
        # further down.
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
    - if: inputs.test-deps == 'true'
      shell: bash
      # Unconditional for the test job: the coverage gate needs these whether or
      # not the project's own dev extra happens to include them.
      run: pip install pytest pytest-cov
