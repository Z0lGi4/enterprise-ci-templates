name: 'Secret Scan'
description: 'Fail the job if gitleaks finds a committed secret'
runs:
  using: 'composite'
  steps:
    - name: Run gitleaks
      uses: gitleaks/gitleaks-action@v2
      with:
        args: '--log-opts= --verbose'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITLEAKS_ENABLE_COMMENTS: 'false'
