name: Review Agent (reusable)
# The review gate on its own, for repos that keep their own lint/test
# pipeline (ARIA, ContentAIPlatform, social-mind) and want just this one.
# Same composite action as python-ci.yml and node-ci.yml, so the three
# cannot disagree.
#
# Caller:
#   name: review
#   on: pull_request
#   jobs:
#     review-agent:
#       uses: Z0lGi4/enterprise-ci-templates/.github/workflows/review-agent.yml@<full commit sha> # v1
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review-agent:
    runs-on: ubuntu-latest
    # Same-repo, non-draft PRs only: fork PRs never see the OAuth secret, and a
    # draft is not ready for review — each run is real plan usage (a session
    # limit was hit after a day of reviewing every push). Mark ready to review.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      # This repo, at the exact commit of the workflow that is running — so a
      # workflow pinned by SHA never pulls a floating action. Nothing here is
      # secret; the repo is public.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Z0lGi4/enterprise-ci-templates
          ref: ${{ github.job_workflow_sha }}
          path: .framework
      - uses: ./.framework/.github/actions/review-agent
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base-ref: ${{ github.base_ref }}
