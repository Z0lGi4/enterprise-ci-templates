name: Review Agent (reusable)
# The review gate on its own, for repos that keep their own lint/test
# pipeline (ARIA, ContentAIPlatform, social-mind) and want just this one.
# Same composite action as python-ci.yml and node-ci.yml, so the three
# cannot disagree.
#
# Caller:
#   name: review
#   on: pull_request
#   jobs:
#     review-agent:
#       uses: Z0lGi4/enterprise-ci-templates/.github/workflows/review-agent.yml@v1
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review-agent:
    runs-on: ubuntu-latest
    # Fork PRs never see the OAuth secret; same-repo PRs only.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - uses: Z0lGi4/enterprise-ci-templates/.github/actions/review-agent@v1
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base-ref: ${{ github.base_ref }}
