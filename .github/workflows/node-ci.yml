name: Node CI (reusable)
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
      working-directory:
        type: string
        default: '.'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
      - working-directory: ${{ inputs.working-directory }}
        run: |
          corepack enable
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            npm install
          fi
      - working-directory: ${{ inputs.working-directory }}
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }  # diff-cover needs the merge base with the PR's target
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
      - working-directory: ${{ inputs.working-directory }}
        run: |
          corepack enable
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            npm install
          fi
      - name: Run tests with 80% coverage gate
        working-directory: ${{ inputs.working-directory }}
        run: npm test -- --coverage.thresholds.lines=80 --coverage.thresholds.statements=80 --coverage.reporter=text --coverage.reporter=lcov
      - name: Diff coverage gate (changed lines >= 80%)
        # Only lines the PR touches count; see python-ci.yml. Reads the lcov the
        # test step just wrote, and fails if the runner did not write one.
        if: github.event_name == 'pull_request'
        working-directory: ${{ inputs.working-directory }}
        env:
          # Through env, never interpolated into the script: a branch name is
          # still attacker-shaped input as far as the shell is concerned.
          BASE_REF: ${{ github.base_ref }}
        run: |
          test -f coverage/lcov.info || { echo '::error::coverage/lcov.info missing - the test runner must emit lcov'; exit 1; }
          # vitest writes SF: paths relative to the package while git diff paths are
          # repo-root-relative; diff-cover only matches the latter (measured: an
          # absolute path matched from the repo root but not from the package, a
          # package-relative one matched from neither). Prefix with the package's
          # path inside the repo, which is empty when working-directory is '.'.
          PREFIX=$(git rev-parse --show-prefix)
          sed -i "s#^SF:#SF:${PREFIX}#" coverage/lcov.info
          pipx install diff-cover==10.5.1
          diff-cover coverage/lcov.info --compare-branch="origin/$BASE_REF" --fail-under=80

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      # contents: read is all it needs — the scan reads the commit range out of
      # the local checkout instead of asking the API for it.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      # This repo, at the exact commit of the workflow that is running — so a
      # workflow pinned by SHA never pulls a floating action. Nothing here is
      # secret; the repo is public.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Z0lGi4/enterprise-ci-templates
          ref: ${{ github.job_workflow_sha }}
          path: .framework
      # gitleaks runs in git mode over THIS repo's commits; the untracked
      # .framework checkout (a separate repository) is never part of that scan.
      - uses: ./.framework/.github/actions/secret-scan
      # The framework checkout must not be in the tree when tests, coverage
      # or lint look at it: its fixtures contain tests of their own.
      - run: rm -rf .framework

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
      - working-directory: ${{ inputs.working-directory }}
        run: |
          corepack enable
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            npm install
          fi
      - name: Audit dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm audit --audit-level=high
          else
            npm audit --audit-level=high
          fi

  review-agent:
    runs-on: ubuntu-latest
    # Same-repo, non-draft PRs only: fork PRs never see the OAuth secret, and a
    # draft is not ready for review — each run is real plan usage (a session
    # limit was hit after a day of reviewing every push). Mark ready to review.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      # One implementation for python-ci, node-ci and the standalone
      # review-agent.yml: see .github/actions/review-agent/action.yml.
      # This repo, at the exact commit of the workflow that is running — so a
      # workflow pinned by SHA never pulls a floating action. Nothing here is
      # secret; the repo is public.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Z0lGi4/enterprise-ci-templates
          ref: ${{ github.job_workflow_sha }}
          path: .framework
      - uses: ./.framework/.github/actions/review-agent
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base-ref: ${{ github.base_ref }}
