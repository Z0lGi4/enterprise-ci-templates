name: Docs Sync (reusable)
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: Check for CLAUDE_CODE_OAUTH_TOKEN
        id: token_check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not configured on this repo — the automated docs-sync regeneration is NOT active. Run 'claude setup-token' locally and add the result as a repo secret to enable it. Docs were NOT regenerated by this run."
            echo "token_present=false" >> "$GITHUB_OUTPUT"
          else
            echo "token_present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.token_check.outputs.token_present == 'true'
        with: { node-version: '22' }
      - name: Install Claude Code
        if: steps.token_check.outputs.token_present == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.263
      - name: Regenerate technical overview
        if: steps.token_check.outputs.token_present == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mkdir -p docs
          claude -p "Write or overwrite docs/TECHNICAL_OVERVIEW.md to accurately describe the current state of this codebase: architecture, tech stack, key components, and API surface. Base it only on what you actually find in the repository. Do not read, quote, or reference the contents of any file matching .env*, *.pem, *.key, or anything that looks like it contains a credential, API key, or secret; if such a file is relevant to describe, name only its existence and purpose, never its contents." \
            --allowedTools "Read,Write,Glob,Grep" --max-turns 15
      - name: Regenerate slide deck HTML
        if: steps.token_check.outputs.token_present == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "Write or overwrite docs/deck.html as a concise, self-contained HTML slide deck (inline CSS, no external assets, no network requests) covering: what this product is, its architecture, and current status. Base it only on what you actually find in the repository. Do not read, quote, or reference the contents of any file matching .env*, *.pem, *.key, or anything that looks like it contains a credential, API key, or secret; if such a file is relevant to describe, name only its existence and purpose, never its contents." \
            --allowedTools "Read,Write,Glob,Grep" --max-turns 15
      - name: Secret-scan generated docs before committing
        if: steps.token_check.outputs.token_present == 'true'
        # gitleaks v8.30.1 (github.com/gitleaks/gitleaks/releases/tag/v8.30.1).
        # The shared secret-scan action wraps gitleaks-action, which only scans
        # git history for the triggering commit range — never the working tree.
        # docs/TECHNICAL_OVERVIEW.md and docs/deck.html are generated above and
        # not yet `git add`ed, so that action would silently scan nothing of
        # what it's meant to protect. Run gitleaks directly in --no-git mode
        # against docs/ instead.
        run: |
          curl -sSL -O "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSL -O "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt"
          # -O keeps each file's original release name so it matches the entries in
          # gitleaks_8.30.1_checksums.txt; renaming the tarball on download (e.g. -o
          # gitleaks.tar.gz) would make --ignore-missing find nothing to check against
          # and skip verification entirely — silently, not just on this one release.
          sha256sum --ignore-missing -c gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks detect --no-git --source docs/ --no-banner -v --redact
      - name: Render deck.html to deck.pdf
        if: steps.token_check.outputs.token_present == 'true'
        run: |
          npx --yes playwright install --with-deps chromium
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const context = await browser.newContext({ javaScriptEnabled: false });
            const page = await context.newPage();
            await page.goto('file://' + process.cwd() + '/docs/deck.html');
            await page.pdf({ path: 'docs/deck.pdf', format: 'A4', printBackground: true });
            await browser.close();
          })();
          "
      - name: Open automated-docs PR
        if: steps.token_check.outputs.token_present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "docs-sync-bot"
          git config user.email "docs-sync-bot@users.noreply.github.com"
          git add docs/TECHNICAL_OVERVIEW.md docs/deck.html docs/deck.pdf
          if git diff --cached --quiet; then
            echo "No doc changes, skipping PR"
            exit 0
          fi
          BRANCH="automated-docs-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "docs: auto-regenerate technical overview and slide deck"
          git push origin "$BRANCH"
          gh pr create --title "docs: auto-regenerate technical overview and slide deck" \
            --body "Automated by docs-sync.yml." \
            --label "automated-docs" \
            --base main --head "$BRANCH"
          gh pr merge "$BRANCH" --auto --squash
