name: Test - Secret Scan
on: [push, pull_request]
jobs:
  should-fail:
    runs-on: ubuntu-latest
    # pull-requests: read is needed only for pull_request-triggered runs,
    # where gitleaks-action lists PR commits via the GitHub API (see
    # .github/actions/secret-scan/action.yml's comment — this smoke test
    # exercises both event types so a regression here is caught, not just
    # on real adopting repos' PRs).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/secret-scan
