name: Test - Secret Scan
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  # Proves the action RUNS and picks a sane commit range on both event types.
  # The log line "Scanning commit range: X..Y" is the evidence.
  runs-clean:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/secret-scan

  # Proves it actually DETECTS. A green secret-scan that can't find anything is
  # the exact failure this repo has already shipped twice (an inert docs-sync
  # scan; smoke tests masked by a placeholder secret), so "it ran" is not
  # evidence that it works.
  #
  # The canary is written at runtime, never committed: a committed canary would
  # poison every full-history scan of this repo forever, including the action's
  # own no-range fallback.
  detects-a-secret:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: '8.30.1'
    steps:
      - name: Plant a canary and assert gitleaks fails on it
        run: |
          set -euo pipefail
          V="$GITLEAKS_VERSION"
          cd "$RUNNER_TEMP"
          curl -sSL -O "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSL -O "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${V}_checksums.txt"
          tar -xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks

          mkdir -p canary
          # NOT an AWS key ending in EXAMPLE — gitleaks' default allowlist
          # ignores those, which silently defeated an earlier version of this
          # very test.
          printf 'aws_secret_access_key = "%s"\n' 'wJk9QeP2rT7xLmN4vB1cZ8yH5sD3gF6aQ0uI2oE7' > canary/creds.tf

          set +e
          ./gitleaks detect --no-git --source canary --no-banner -v --redact
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::gitleaks exited 0 on a planted secret — the scan is not detecting anything."
            exit 1
          fi
          echo "gitleaks correctly failed (exit $rc) on the planted secret."
