name: Test - Docs Sync
on:
  push:
    paths:
      - '.github/workflows/docs-sync.yml'
      - '.github/workflows/test-docs-sync.yml'
  workflow_dispatch:
jobs:
  call-docs-sync:
    uses: ./.github/workflows/docs-sync.yml
    secrets:
      # NOT `secrets: inherit` — that hands EVERY repo secret (AWS keys, DB
      # passwords, Stripe keys) to a workflow in another repo, pinned to a
      # mutable @main ref. This framework needs exactly one secret; pass only
      # that one.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
